services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shindig
      POSTGRES_PASSWORD: shindig
      POSTGRES_DB: shindig
    ports:
      # 5433 on the host: 5432 is often taken by a native Postgres.
      - "5433:5432"
    volumes:
      - shindig-pg:/var/lib/postgresql/data
volumes:
  shindig-pg:
